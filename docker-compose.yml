version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: yams_mysql
    restart: always
    environment:
      MYSQL_DATABASE: yams_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: yams_user
      MYSQL_PASSWORD: yams_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: